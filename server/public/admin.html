<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XiCheng · 运营后台</title>
<link rel="icon" href="/log.jpg" />
<style>
:root{--bg:#08090b;--panel:#101216;--panel2:#15171c;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.17);--txt:#edeff3;--dim:#9ba1ac;--mute:#5e6470;--violet:#8b7bff;--violet2:#c7bffe;--green:#63e6be;--amber:#ffc078;--red:#ff8787;--font:Bahnschrift,"Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:14px/1.55 var(--font)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 460px at 8% -10%,rgba(139,123,255,.16),transparent 68%),radial-gradient(620px 420px at 100% 0,rgba(99,230,190,.07),transparent 70%)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}.hidden{display:none!important}.mono{font-family:var(--mono);font-size:12px}.muted{color:var(--mute)}
.shell{min-height:100vh;position:relative}.top{height:68px;position:sticky;top:0;z-index:20;display:flex;align-items:center;padding:0 30px;border-bottom:1px solid var(--line);background:rgba(8,9,11,.84);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.02em}.brand img{width:32px;height:32px;border-radius:9px;object-fit:cover;border:1px solid rgba(139,123,255,.55)}.brand small{display:block;color:var(--mute);font:10px var(--mono);letter-spacing:.15em;text-transform:uppercase}.top-right{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--dim);font-size:13px}.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),#5a4ad1);color:#fff;font-weight:800;font-size:12px}.logout{border:0;background:transparent;color:var(--dim);padding:7px 4px}.logout:hover{color:var(--red)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1540px;margin:0 auto}.side{padding:26px 16px;border-right:1px solid var(--line);min-height:calc(100vh - 68px)}.side-label{padding:0 12px 9px;color:var(--mute);font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--dim);padding:10px 12px;text-align:left}.nav button:hover{background:rgba(255,255,255,.045);color:var(--txt)}.nav button.active{background:rgba(139,123,255,.14);border-color:rgba(139,123,255,.28);color:var(--violet2)}.nav .count{margin-left:auto;min-width:20px;padding:1px 6px;border-radius:99px;background:rgba(255,192,120,.16);color:var(--amber);text-align:center;font-size:11px}.side-foot{position:sticky;top:calc(100vh - 135px);margin:28px 12px 0;padding-top:20px;border-top:1px solid var(--line);color:var(--mute);font-size:12px}
.main{padding:34px 38px 70px;min-width:0}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:25px}.eyebrow{color:var(--violet2);font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase}.page-head h1{margin:5px 0 0;font-size:29px;letter-spacing:-.04em}.page-head p{margin:7px 0 0;color:var(--dim)}.refresh{border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:8px;padding:9px 14px;color:var(--dim)}.refresh:hover{border-color:rgba(139,123,255,.6);color:var(--txt)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:25px}.stat{padding:17px 18px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(150deg,rgba(255,255,255,.045),rgba(255,255,255,.012))}.stat-label{color:var(--dim);font-size:12px}.stat-value{display:block;margin-top:7px;font-size:26px;font-weight:800;letter-spacing:-.04em}.stat-value.violet{color:var(--violet2)}.stat-value.amber{color:var(--amber)}.stat-value.green{color:var(--green)}.stat-value.red{color:var(--red)}
.panel{border:1px solid var(--line);border-radius:14px;background:rgba(16,18,22,.86);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:16px}.panel-head p{margin:3px 0 0;color:var(--mute);font-size:12px}.toolbar{display:flex;gap:9px;align-items:center;padding:13px 20px;border-bottom:1px solid var(--line)}.search{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.24);outline:0}.search:focus,.field:focus,.area:focus{border-color:rgba(139,123,255,.7);box-shadow:0 0 0 3px rgba(139,123,255,.13)}.select{padding:9px 30px 9px 11px;border:1px solid var(--line);border-radius:8px;background:#111319;outline:0}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:860px}th,td{padding:13px 15px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font:11px var(--mono);letter-spacing:.08em;background:rgba(255,255,255,.025);white-space:nowrap}tbody tr:hover{background:rgba(139,123,255,.045)}tbody tr:last-child td{border-bottom:0}.claim-no,.order-no{font-family:var(--mono);font-weight:700;color:var(--violet2)}.amount{font-weight:800;color:var(--green)}.sub{display:block;margin-top:3px;color:var(--mute);font-size:12px}.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);font-size:11px;font-weight:700;white-space:nowrap}.b-pending{color:var(--amber);background:rgba(255,192,120,.1);border-color:rgba(255,192,120,.3)}.b-confirmed,.b-done{color:var(--green);background:rgba(99,230,190,.1);border-color:rgba(99,230,190,.3)}.b-paid,.b-doing{color:var(--violet2);background:rgba(139,123,255,.12);border-color:rgba(139,123,255,.3)}.b-rejected,.b-canceled{color:var(--red);background:rgba(255,135,135,.08);border-color:rgba(255,135,135,.25)}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{border:1px solid var(--line2);border-radius:7px;background:rgba(255,255,255,.045);padding:7px 10px;color:var(--dim);font-size:12px}.btn:hover{background:rgba(255,255,255,.1);color:var(--txt)}.btn-primary{border-color:transparent;background:linear-gradient(135deg,#9b8dff,#6f5df0);color:#fff;font-weight:700}.btn-primary:hover{filter:brightness(1.1)}.btn-danger{color:var(--red);border-color:rgba(255,135,135,.3)}.btn-danger:hover{background:rgba(255,135,135,.1)}.empty{padding:50px;text-align:center;color:var(--mute)}.pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:12px 18px;color:var(--dim);font-size:12px}
.grid-two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}.side-panel{padding:18px;border:1px solid var(--line);border-radius:14px;background:rgba(16,18,22,.86)}.side-panel h3{margin:0 0 14px;font-size:14px}.mini-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.mini-row:last-child{border-bottom:0}.mini-row span:first-child{color:var(--dim)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(410px,100%);padding:30px;border:1px solid var(--line2);border-radius:18px;background:linear-gradient(155deg,rgba(255,255,255,.06),rgba(255,255,255,.015));box-shadow:0 30px 80px rgba(0,0,0,.4)}.login-card h1{margin:0;font-size:23px}.login-card p{margin:7px 0 25px;color:var(--dim)}.field-label{display:block;margin:15px 0 7px;color:var(--dim);font-size:12px}.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.25);outline:0}.login-btn{width:100%;margin-top:20px;padding:11px}.error{margin-top:13px;padding:9px 11px;border:1px solid rgba(255,135,135,.3);border-radius:8px;background:rgba(255,135,135,.08);color:var(--red);font-size:12px}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px)}.modal{width:min(920px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line2);border-radius:16px;background:#111318;box-shadow:0 30px 100px rgba(0,0,0,.65)}.modal-head{display:flex;align-items:flex-start;gap:16px;padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:18px}.modal-head p{margin:4px 0 0;color:var(--mute);font-size:12px}.close{margin-left:auto;width:31px;height:31px;border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.04);color:var(--dim)}.modal-body{padding:22px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px}.detail{padding:10px 0;border-bottom:1px solid var(--line)}.detail label{display:block;color:var(--mute);font-size:11px;margin-bottom:3px}.detail strong{font-size:13px;word-break:break-word}.detail.full{grid-column:1/-1}.shot{max-width:100%;max-height:430px;display:block;margin:10px auto 0;border-radius:10px;border:1px solid var(--line);background:#fff}.ocr{padding:12px;border-radius:9px;background:rgba(139,123,255,.08);border:1px solid rgba(139,123,255,.23);color:var(--violet2);font-size:12px}.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:16px 22px;border-top:1px solid var(--line)}.area{width:100%;min-height:90px;resize:vertical;padding:10px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.25);outline:0}
.toast{position:fixed;right:25px;bottom:24px;z-index:100;padding:11px 16px;border:1px solid var(--line2);border-radius:9px;background:#17191f;box-shadow:0 18px 45px rgba(0,0,0,.45);font-size:13px}.toast.ok{border-color:rgba(99,230,190,.4);color:var(--green)}.toast.bad{border-color:rgba(255,135,135,.4);color:var(--red)}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.side{min-height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 20px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-label,.side-foot{display:none}.main{padding:25px 20px}.grid-two{grid-template-columns:1fr}}@media(max-width:700px){.top{padding:0 16px}.top-right span{display:none}.main{padding:20px 13px}.stats{grid-template-columns:repeat(2,1fr)}.page-head{align-items:flex-start;flex-direction:column}.detail-grid{grid-template-columns:1fr}.detail.full{grid-column:auto}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  'use strict';
  const app = document.querySelector('#app');
  const state = { token: localStorage.getItem('xc_admin_token') || '', admin: null, tab: 'claims', claimStatus: 'pending', claimRows: [], orderRows: [], claimStats: {}, orderStats: null, claimPage: 1, orderPage: 1, claimTotal: 0, orderTotal: 0, keyword: '', loading: false, modal: null, toast: null };
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = (n) => `¥${Number(n || 0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  const time = (v) => v ? new Date(v).toLocaleString('zh-CN',{hour12:false}) : '—';
  const statusLabel = { pending:'待核对到账', confirmed:'已核对 · 已转订单', rejected:'已驳回', expired:'已过期', wait:'待开始', paid:'已付款', doing:'剪辑中', done:'已完成', canceled:'已取消' };
  async function api(path, opts = {}) {
    const headers = {...(opts.body ? {'content-type':'application/json'} : {}), ...(state.token ? {authorization:`Bearer ${state.token}`} : {}), ...(opts.headers || {})};
    const r = await fetch(path, {...opts, headers});
    const text = await r.text(); let body = {}; try { body = JSON.parse(text); } catch {}
    if (r.status === 401 || body?.error?.code === 'UNAUTHORIZED') { logout(); throw new Error('登录已过期'); }
    if (!r.ok || body?.ok === false) throw new Error(body?.error?.message || `请求失败（${r.status}）`);
    return body.data ?? body;
  }
  function notify(message, kind='ok') { state.toast = {message,kind}; render(); setTimeout(() => { state.toast = null; render(); }, 2800); }
  function logout() { state.token=''; state.admin=null; localStorage.removeItem('xc_admin_token'); render(); }
  function badge(status) { return `<span class="badge b-${esc(status)}">${esc(statusLabel[status] || status || '—')}</span>`; }
  function loginView() { return `<main class="login"><form class="login-card" id="loginForm"><div class="brand"><img src="/log.jpg"><div>XiCheng<small>OPERATIONS CONSOLE</small></div></div><h1 style="margin-top:25px">登录运营后台</h1><p>付款核验、订单流转与运营数据</p><label class="field-label">管理员账号</label><input class="field" name="username" autocomplete="username" required autofocus><label class="field-label">密码</label><input class="field" type="password" name="password" autocomplete="current-password" required><button class="btn btn-primary login-btn">进入后台</button>${state.loginError?`<div class="error">${esc(state.loginError)}</div>`:''}</form></main>`; }
  function shellView() {
    const pending = state.claimStats.pending?.count || 0;
    return `<div class="shell"><header class="top"><div class="brand"><img src="/log.jpg"><div>XiCheng<small>OPERATIONS CONSOLE</small></div></div><div class="top-right"><span>${esc(state.admin?.displayName || state.admin?.username || '管理员')}</span><span class="avatar">${esc((state.admin?.displayName || '管').slice(0,1))}</span><button class="logout" id="logout">退出</button></div></header><div class="layout"><aside class="side"><div class="side-label">Workspace</div><nav class="nav"><button class="${state.tab==='claims'?'active':''}" data-tab="claims">◈ <span>付款核验</span><b class="count">${pending}</b></button><button class="${state.tab==='orders'?'active':''}" data-tab="orders">▣ <span>订单管理</span></button></nav><div class="side-foot">桌面端运营后台<br><span>Linear dark system · v2</span></div></aside><main class="main">${state.tab==='claims'?claimsView():ordersView()}</main></div></div>`;
  }
  function header(title, desc) { return `<div class="page-head"><div><div class="eyebrow">${state.tab==='claims'?'PAYMENT REVIEW':'ORDER OPERATIONS'}</div><h1>${title}</h1><p>${desc}</p></div><button class="refresh" id="refresh">↻ 刷新数据</button></div>`; }
  function statsView() { const s=state.orderStats||{}; const by=s.byStatus||{}; return `<section class="stats"><div class="stat"><span class="stat-label">待核对付款</span><strong class="stat-value amber">${state.claimStats.pending?.count||0}</strong></div><div class="stat"><span class="stat-label">待核对金额</span><strong class="stat-value amber">${money(state.claimStats.pending?.amount)}</strong></div><div class="stat"><span class="stat-label">已付款订单</span><strong class="stat-value violet">${by.paid?.count||0}</strong></div><div class="stat"><span class="stat-label">剪辑中</span><strong class="stat-value violet">${by.doing?.count||0}</strong></div><div class="stat"><span class="stat-label">已完成</span><strong class="stat-value green">${by.done?.count||0}</strong></div></section>`; }
  function claimsView() { return header('付款核验','确认到账后才会生成正式订单，所有截图和 OCR 结果都在这里留档')+statsView()+`<section class="panel"><div class="panel-head"><div><h2>付款待核对</h2><p>优先处理待核对记录；自动 OCR 不一致时进入人工队列</p></div><select id="claimStatus" class="select"><option value="pending" ${state.claimStatus==='pending'?'selected':''}>待核对</option><option value="confirmed" ${state.claimStatus==='confirmed'?'selected':''}>已确认</option><option value="rejected" ${state.claimStatus==='rejected'?'selected':''}>已驳回</option><option value="" ${!state.claimStatus?'selected':''}>全部记录</option></select></div><div class="toolbar"><input id="keyword" class="search" value="${esc(state.keyword)}" placeholder="搜索待核对编号、转账单号、联系方式…"><button class="btn" id="searchBtn">搜索</button></div><div class="table-scroll"><table><thead><tr><th>待核对编号</th><th>客户与规格</th><th>付款信息</th><th>OCR 结果</th><th>提交时间</th><th>操作</th></tr></thead><tbody>${state.claimRows.length?state.claimRows.map(claimRow).join(''):`<tr><td colspan="6"><div class="empty">暂无${state.claimStatus==='pending'?'待核对':''}付款记录</div></td></tr>`}</tbody></table></div><div class="pager">第 ${state.claimPage} 页 · 共 ${state.claimTotal} 条 <button class="btn" id="claimPrev" ${state.claimPage<=1?'disabled':''}>上一页</button><button class="btn" id="claimNext" ${state.claimRows.length<20?'disabled':''}>下一页</button></div></section>`; }
  function claimRow(c) { const can=c.status==='pending'; return `<tr><td><button class="claim-no" data-claim="${esc(c.claimNo)}" style="border:0;background:none;padding:0">${esc(c.claimNo)}</button><span class="sub">${esc(c.contact||'未留联系方式')}</span></td><td><strong>${esc(c.gameName)}</strong><span class="sub">${esc(c.pkgName)} · ${esc(c.quantity)}${esc(c.unit)}</span></td><td><span class="amount">${money(c.totalAmount)}</span><span class="sub mono">${esc(c.payNo||c.payRef||'—')}</span></td><td>${c.ocrOk?'<span class="badge b-confirmed">OCR 一致</span>':'<span class="badge b-pending">人工复核</span>'}<span class="sub" title="${esc(c.ocrNote)}">${esc(c.ocrNote||'未记录 OCR 备注').slice(0,34)}${(c.ocrNote||'').length>34?'…':''}</span></td><td class="muted">${time(c.createdAt)}</td><td><div class="actions"><button class="btn" data-claim="${esc(c.claimNo)}">查看</button>${can?`<button class="btn btn-primary" data-confirm="${esc(c.claimNo)}">确认到账</button><button class="btn btn-danger" data-reject="${esc(c.claimNo)}">驳回</button>`:''}</div></td></tr>`; }
  function ordersView() { return header('订单管理','已确认到账的订单进入剪辑队列，在这里推进状态和查看客户需求')+statsView()+`<section class="panel"><div class="panel-head"><div><h2>订单列表</h2><p>订单号、客户信息、交付状态与操作记录</p></div></div><div class="toolbar"><input id="orderKeyword" class="search" value="${esc(state.orderKeyword||'')}" placeholder="搜索订单号、联系方式…"><button class="btn" id="orderSearch">搜索</button></div><div class="table-scroll"><table><thead><tr><th>订单号</th><th>客户与规格</th><th>金额</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${state.orderRows.length?state.orderRows.map(orderRow).join(''):`<tr><td colspan="6"><div class="empty">暂无订单</div></td></tr>`}</tbody></table></div><div class="pager">第 ${state.orderPage} 页 · 共 ${state.orderTotal} 条 <button class="btn" id="orderPrev" ${state.orderPage<=1?'disabled':''}>上一页</button><button class="btn" id="orderNext" ${state.orderRows.length<20?'disabled':''}>下一页</button></div></section>`; }
  function orderRow(o) { return `<tr><td><button class="order-no" data-order="${esc(o.orderNo)}" style="border:0;background:none;padding:0">${esc(o.orderNo)}</button><span class="sub">${esc(o.contact||'')}</span></td><td><strong>${esc(o.gameName)}</strong><span class="sub">${esc(o.pkgName)} · ${esc(o.quantity)}${esc(o.unit)}</span></td><td><span class="amount">${money(o.totalAmount)}</span><span class="sub">已付 ${money(o.paidAmount)}</span></td><td>${badge(o.status)}</td><td class="muted">${time(o.createdAt)}</td><td><button class="btn" data-order="${esc(o.orderNo)}">查看详情</button></td></tr>`; }
  function modalView() { if(!state.modal)return ''; const c=state.modal.type==='claim'?state.modal.data:null; const o=state.modal.type==='order'?state.modal.data:null; if(c)return `<div class="overlay" id="overlay"><section class="modal"><div class="modal-head"><div><div class="eyebrow">PAYMENT CLAIM</div><h2>${esc(c.claimNo)}</h2><p>${badge(c.status)} · 提交于 ${time(c.createdAt)}</p></div><button class="close" id="closeModal">×</button></div><div class="modal-body"><div class="detail-grid"><div class="detail"><label>游戏 / 规格</label><strong>${esc(c.gameName)} · ${esc(c.pkgName)}</strong></div><div class="detail"><label>应付金额</label><strong class="amount">${money(c.totalAmount)}</strong></div><div class="detail"><label>联系方式</label><strong>${esc(c.contact)}</strong></div><div class="detail"><label>转账单号</label><strong class="mono">${esc(c.payNo||'—')}</strong></div><div class="detail"><label>付款备注</label><strong class="mono">${esc(c.payRef||'—')}</strong></div><div class="detail"><label>配乐 / 素材</label><strong>${c.music==='self'?'客户自备':'剪辑师自选'} · ${c.material==='ready'?'已准备好':'稍后提供'}</strong></div><div class="detail full"><label>OCR 核验记录</label><div class="ocr">${esc(c.ocrNote||'未记录 OCR 结果')}</div></div><div class="detail full"><label>剪辑需求</label><strong>${esc(c.requirement||'未填写')}</strong></div>${c.refLink?`<div class="detail full"><label>参考链接</label><strong>${esc(c.refLink)}</strong></div>`:''}<div class="detail full"><label>付款截图</label>${c.payShot?`<a href="${esc(c.payShot)}" target="_blank" rel="noreferrer"><img class="shot" src="${esc(c.payShot)}" alt="付款截图"></a>`:'<span class="muted">未上传</span>'}</div></div></div>${c.status==='pending'?`<div class="modal-foot"><button class="btn btn-danger" data-reject="${esc(c.claimNo)}">驳回</button><button class="btn btn-primary" data-confirm="${esc(c.claimNo)}">确认到账并生成订单</button></div>`:''}</section></div>`; if(o)return `<div class="overlay" id="overlay"><section class="modal"><div class="modal-head"><div><div class="eyebrow">ORDER DETAIL</div><h2>${esc(o.orderNo)}</h2><p>${badge(o.status)} · ${time(o.createdAt)}</p></div><button class="close" id="closeModal">×</button></div><div class="modal-body"><div class="detail-grid"><div class="detail"><label>客户</label><strong>${esc(o.contact)}</strong></div><div class="detail"><label>金额</label><strong class="amount">${money(o.totalAmount)} · 已付 ${money(o.paidAmount)}</strong></div><div class="detail"><label>游戏 / 规格</label><strong>${esc(o.gameName)} · ${esc(o.pkgName)}</strong></div><div class="detail"><label>交付期限</label><strong>${time(o.dueAt)}</strong></div><div class="detail full"><label>剪辑要求</label><strong>${esc(o.requirement||'未填写')}</strong></div></div></div><div class="modal-foot"><select class="select" id="orderStatus"><option value="wait">待开始</option><option value="paid">已付款</option><option value="doing">剪辑中</option><option value="done">已完成</option><option value="canceled">已取消</option></select><button class="btn btn-primary" data-status="${esc(o.orderNo)}">更新状态</button></div></section></div>`; return ''; }
  function render() { app.innerHTML = state.token && state.admin ? shellView()+modalView() : loginView(); bind(); }
  async function loadAll() { state.loading=true; try { const [cs,os,st] = await Promise.all([api(`/api/admin/payment-claims?status=${encodeURIComponent(state.claimStatus)}&keyword=${encodeURIComponent(state.keyword)}&page=${state.claimPage}&pageSize=20`), api(`/api/admin/orders?keyword=${encodeURIComponent(state.orderKeyword||'')}&page=${state.orderPage}&pageSize=20`), api('/api/admin/stats')]); state.claimRows=cs.rows||[];state.claimTotal=cs.total||0;state.claimStats=cs.stats||{};state.orderRows=os.rows||[];state.orderTotal=os.total||0;state.orderStats=st; } catch(e) { notify(e.message,'bad'); } finally {state.loading=false; render();} }
  async function openClaim(no) { try { const data=await api(`/api/admin/payment-claims?keyword=${encodeURIComponent(no)}&pageSize=1`); state.modal={type:'claim',data:data.rows?.[0]}; render(); } catch(e){notify(e.message,'bad');} }
  async function openOrder(no) { try { const data=await api(`/api/admin/orders/${encodeURIComponent(no)}`); state.modal={type:'order',data:data.order}; render(); } catch(e){notify(e.message,'bad');} }
  async function confirmClaim(no) { const note=prompt('确认到账备注（可选）：',''); if(note===null)return; try { const r=await api(`/api/admin/payment-claims/${encodeURIComponent(no)}/confirm`,{method:'POST',body:JSON.stringify({note})}); state.modal=null; notify(`已确认到账，订单 ${r.order.orderNo} 已生成`); await loadAll(); } catch(e){notify(e.message,'bad');} }
  async function rejectClaim(no) { const note=prompt('驳回原因：','未查到对应到账'); if(note===null)return; try { await api(`/api/admin/payment-claims/${encodeURIComponent(no)}/reject`,{method:'POST',body:JSON.stringify({note})}); state.modal=null; notify('已驳回该付款记录'); await loadAll(); } catch(e){notify(e.message,'bad');} }
  async function updateOrder(no) { const status=document.querySelector('#orderStatus')?.value; try { await api(`/api/admin/orders/${encodeURIComponent(no)}/status`,{method:'PATCH',body:JSON.stringify({status})}); state.modal=null; notify('订单状态已更新'); await loadAll(); } catch(e){notify(e.message,'bad');} }
  function bind() { const login=document.querySelector('#loginForm'); if(login) { login.addEventListener('submit',async(e)=>{e.preventDefault();const fd=new FormData(login);try{const r=await api('/api/admin/login',{method:'POST',body:JSON.stringify(Object.fromEntries(fd))});state.token=r.token;state.admin=r.admin;localStorage.setItem('xc_admin_token',r.token);state.loginError='';render();await loadAll();}catch(x){state.loginError=x.message;render();}});return; }
    document.querySelector('#logout')?.addEventListener('click',logout);document.querySelector('#refresh')?.addEventListener('click',loadAll);document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;render();}));document.querySelector('#claimStatus')?.addEventListener('change',e=>{state.claimStatus=e.target.value;state.claimPage=1;loadAll()});document.querySelector('#searchBtn')?.addEventListener('click',()=>{state.keyword=document.querySelector('#keyword').value;state.claimPage=1;loadAll()});document.querySelector('#orderSearch')?.addEventListener('click',()=>{state.orderKeyword=document.querySelector('#orderKeyword').value;state.orderPage=1;loadAll()});document.querySelector('#claimPrev')?.addEventListener('click',()=>{state.claimPage--;loadAll()});document.querySelector('#claimNext')?.addEventListener('click',()=>{state.claimPage++;loadAll()});document.querySelector('#orderPrev')?.addEventListener('click',()=>{state.orderPage--;loadAll()});document.querySelector('#orderNext')?.addEventListener('click',()=>{state.orderPage++;loadAll()});document.querySelector('#closeModal')?.addEventListener('click',()=>{state.modal=null;render()});document.querySelector('#overlay')?.addEventListener('click',e=>{if(e.target.id==='overlay'){state.modal=null;render()}});document.querySelectorAll('[data-claim]').forEach(b=>b.addEventListener('click',()=>openClaim(b.dataset.claim)));document.querySelectorAll('[data-order]').forEach(b=>b.addEventListener('click',()=>openOrder(b.dataset.order)));document.querySelectorAll('[data-confirm]').forEach(b=>b.addEventListener('click',()=>confirmClaim(b.dataset.confirm)));document.querySelectorAll('[data-reject]').forEach(b=>b.addEventListener('click',()=>rejectClaim(b.dataset.reject)));document.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>updateOrder(b.dataset.status))); }
  (async()=>{ if(state.token){try{const r=await api('/api/admin/me');state.admin=r.admin;render();await loadAll();}catch{logout();}}else render(); })();
})();
</script>
</body>
</html>
